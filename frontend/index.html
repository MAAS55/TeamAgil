<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventFlow</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
    
</head>
<body>
    <header class="header">
        <h1>Event Flow</h1>
        <nav class="nav-bar">
            <ul>
                <li><a href="#about">Om Event Flow</a></li>
                <li><a href="#events">Visa Arrangemangs</a></li>
                <li><a href="Booking/Booking.html">Boka Arrangemang</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section id="about" class="about">
            <img src="images/concert_crowd_people_134866_2560x1080.jpg" alt="Event Flow Logo" class="logo">
            <div class="about-text">
                <h2>Upptäck och upplev det som händer nära dig!</h2>
                <p>Eventflow samlar alla lokala evenemang från kommuner och föreningar på ett ställe. Hitta dina favoriter, se var det händer och säkra din plats direkt.</p>
            </div>
            
        </section>
        <section id="events">
            <h2>Nuvarande Arrangemangs</h2>
            <section class="search-section">
            <form class="search-form">
                <input type="search" id="searchinput" placeholder="Sök evenemang">
                <ul id="suggestionList"></ul>
                <button type="submit">Sök</button>
            </form>
        </section>
            <form id="filterForm">
                <div>
                    <label for="filterStatus">Filter</label>
                    <input id="filterStatus" type="checkbox">
                </div>
                <div>
                    <label for="filterLocation">Location: </label>
                    <select name="filter_location" id="filterLocation">
                        <option value="">Choose Location</option>
                    </select>
                </div>
                <div>
                    <label for="filterCategory">Category: </label>
                    <select name="filter_category" id="filterCategory">
                        <option value="">Choose Category</option>
                    </select>
                </div>
                <div>
                    <label for="filterOrganizer">Organizer: </label>
                    <select name="filter_organizer" id="filterOrganizer">
                        <option value="">Choose Organizer</option>
                    </select>
                </div>
            </form>

            <div class="event-list" id="eventList">
            </div>
        </section>
    </main>
    <footer>

    </footer>
</body>
</html>
